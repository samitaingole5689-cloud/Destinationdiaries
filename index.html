    <script>
      (function() {
        try {
          var s = localStorage.getItem('destination_font_size');
          if (s) {
            var n = parseInt(s, 10);
            if (!isNaN(n) && n >= 12 && n <= 22) {
              document.documentElement.style.fontSize = n + 'px';
            }
          }
        } catch (e) {}
      })();
    </script>
